name: Overnight resumable Online backfill

on:
  workflow_dispatch:
  schedule:
    # 23:35 UTC and 00:35-06:35 UTC. The date guard below limits this to tonight.
    - cron: "35 23,0-6 * * *"

permissions:
  contents: write

concurrency:
  group: historical-online-backfill
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Limit scheduled runs to this overnight backfill
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(date -u +%F)
          if [[ "$TODAY" != "2026-09-13" && "$TODAY" != "2026-09-14" ]]; then
            echo "Outside the intended overnight window; exiting."
            exit 0
          fi

      - name: Check out backfill branch
        uses: actions/checkout@v4
        with:
          ref: historical-online-chunked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resume monthly chunks
        run: |
          set -euo pipefail

          TARGET_BRANCH="historical-online-chunked"
          FINAL="2026-09-13"

          # Ensure discovery exists; this returns immediately when already checkpointed.
          python scripts/backfill_online_chunked.py \
            --mode discover \
            --start-date "2024-09-01" \
            --end-date "$FINAL" \
            --min-players 50

          git add data/raw/online/backfill/discovery
          if ! git diff --cached --quiet; then
            git commit -m "data: checkpoint Online tournament discovery"
            git push origin HEAD:$TARGET_BRANCH
          fi

          CUR="2024-09-01"
          while [[ "$CUR" < "$FINAL" || "$CUR" == "$FINAL" ]]; do
            NEXT=$(date -I -d "$CUR +1 month")
            END=$(date -I -d "$NEXT -1 day")
            if [[ "$END" > "$FINAL" ]]; then
              END="$FINAL"
            fi

            CHUNK_DIR="data/raw/online/backfill/chunks/${CUR}_${END}"
            echo "=== Resume chunk: $CUR to $END ==="

            python scripts/backfill_online_chunked.py \
              --mode chunk \
              --chunk-start "$CUR" \
              --chunk-end "$END" \
              --min-players 50

            git add "$CHUNK_DIR"
            if ! git diff --cached --quiet; then
              git commit -m "data: Online backfill $CUR to $END"
              git push origin HEAD:$TARGET_BRANCH
            else
              echo "Already checkpointed: $CUR to $END"
            fi

            if [[ "$END" == "$FINAL" ]]; then
              echo "Historical Online backfill complete through $FINAL."
              break
            fi
            CUR="$NEXT"
          done
