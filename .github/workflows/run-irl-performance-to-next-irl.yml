name: Run IRL performance to next IRL analysis

on:
  push:
    branches:
      - research/irl-performance-to-next-irl
    paths:
      - "scripts/analyse_irl_performance_to_next_irl.py"
      - ".github/workflows/run-irl-performance-to-next-irl.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "irl-performance-to-next-irl-research"
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoped research branch
        uses: actions/checkout@v4
        with:
          ref: research/irl-performance-to-next-irl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 2 IRL performance prediction analysis
        run: python scripts/analyse_irl_performance_to_next_irl.py

      - name: Commit generated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/irl-performance-to-next-irl results/irl-performance-to-next-irl
          if ! git diff --cached --quiet; then
            git commit -m "analysis: record IRL performance prediction results"
            git push origin HEAD:research/irl-performance-to-next-irl
          fi
