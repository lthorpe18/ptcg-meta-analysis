name: Run forecast user relevance analysis

on:
  push:
    branches: [research/forecast-user-relevance]
    paths:
      - 'scripts/analyse_forecast_user_relevance.py'
      - '.github/workflows/run-forecast-user-relevance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/forecast-user-relevance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run user relevance analysis
        run: python scripts/analyse_forecast_user_relevance.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/forecast-user-relevance/summary.json results/forecast-user-relevance/README.md
          if ! git diff --cached --quiet; then
            git commit -m "analysis: record forecast user relevance results"
            git push origin HEAD:research/forecast-user-relevance
          fi
