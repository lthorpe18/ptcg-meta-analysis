name: Fetch historical Online data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2024-09-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-09-13"
      min_players:
        description: "Minimum event players"
        required: true
        default: "50"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Limitless Online history
        run: |
          python scripts/fetch_online.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --min-players "${{ inputs.min_players }}"

      - name: Commit data if changed
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/online
          git commit -m "data: refresh historical Online tournament archive"
          git push
