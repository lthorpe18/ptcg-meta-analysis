name: Run last-year weighting experiment

on:
  push:
    branches:
      - research/last-year-weighting
    paths:
      - "scripts/analyse_last_year_weighting.py"
      - "scripts/analyse_requested_weight_grid.py"
      - "scripts/analyse_flat_and_online_recency.py"
      - "scripts/analyse_latest_online_snapshot.py"
      - ".github/workflows/run-last-year-weighting.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "last-year-weighting-research"
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoped research branch
        uses: actions/checkout@v4
        with:
          ref: research/last-year-weighting

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run last-year weighting analysis
        run: python scripts/analyse_last_year_weighting.py

      - name: Run exhaustive requested grid
        run: python scripts/analyse_requested_weight_grid.py

      - name: Run flat split and Online recency analysis
        run: python scripts/analyse_flat_and_online_recency.py

      - name: Run latest Online snapshot analysis
        run: python scripts/analyse_latest_online_snapshot.py

      - name: Commit generated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/last-year-weighting results/last-year-weighting
          if ! git diff --cached --quiet; then
            git commit -m "analysis: record latest Online snapshot results"
            git push origin HEAD:research/last-year-weighting
          fi
