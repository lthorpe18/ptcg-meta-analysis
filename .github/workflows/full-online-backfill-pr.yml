name: Historical meta backfill

on:
  pull_request:
    paths:
      - ".bootstrap-full-online-v2"

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Discover historical tournament index once
        run: |
          set -euo pipefail
          python scripts/backfill_online_chunked.py \
            --mode discover \
            --start-date "2024-09-01" \
            --end-date "2026-09-13" \
            --min-players 50

          git add data/raw/online/backfill/discovery
          if ! git diff --cached --quiet; then
            git commit -m "data: checkpoint Online tournament discovery"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Fetch and commit monthly chunks
        run: |
          set -euo pipefail
          CUR="2024-09-01"
          FINAL="2026-09-13"

          while [[ "$CUR" < "$FINAL" || "$CUR" == "$FINAL" ]]; do
            NEXT=$(date -I -d "$CUR +1 month")
            END=$(date -I -d "$NEXT -1 day")
            if [[ "$END" > "$FINAL" ]]; then
              END="$FINAL"
            fi

            echo "=== Online backfill chunk: $CUR to $END ==="
            python scripts/backfill_online_chunked.py \
              --mode chunk \
              --chunk-start "$CUR" \
              --chunk-end "$END" \
              --min-players 50

            CHUNK_DIR="data/raw/online/backfill/chunks/${CUR}_${END}"
            git add "$CHUNK_DIR"
            if ! git diff --cached --quiet; then
              git commit -m "data: Online backfill $CUR to $END"
              git push origin HEAD:${{ github.head_ref }}
            else
              echo "Chunk already checkpointed: $CUR to $END"
            fi

            if [[ "$END" == "$FINAL" ]]; then
              break
            fi
            CUR="$NEXT"
          done

      - name: Audit completed Online archive
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit_online_archive.py')
          s = p.read_text()
          old = 'dated = sorted((parse_dt(r["date"]), r) for r in usable_rows if parse_dt(r["date"]))'
          new = 'dated = sorted(((parse_dt(r["date"]), r) for r in usable_rows if parse_dt(r["date"])), key=lambda x: x[0])'
          if old in s:
              p.write_text(s.replace(old, new))
          PY
          python scripts/audit_online_archive.py
          git add results/online-audit
          if ! git diff --cached --quiet; then
            git commit -m "analysis: audit historical Online archive"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Collect historical IRL Labs fields
        run: |
          set -euo pipefail
          python scripts/fetch_irl_labs.py \
            --start-date "2024-09-01" \
            --end-date "2026-09-13"
          git add data/raw/irl/labs
          if ! git diff --cached --quiet; then
            git commit -m "data: collect historical IRL Labs fields"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Audit historical IRL archive
        run: |
          set -euo pipefail
          python scripts/audit_irl_archive.py
          git add results/irl-audit
          if ! git diff --cached --quiet; then
            git commit -m "analysis: audit historical IRL archive"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Tag historical tournaments by legal format
        run: |
          set -euo pipefail
          python scripts/tag_historical_formats.py
          git add data/processed/format-tags
          if ! git diff --cached --quiet; then
            git commit -m "analysis: tag historical tournaments by format"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Build interactive meta explorer
        run: |
          set -euo pipefail
          python scripts/build_dashboard.py
          git add dashboard/index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: build interactive meta explorer"
            git push origin HEAD:${{ github.head_ref }}
          fi
