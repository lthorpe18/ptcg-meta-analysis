name: Build analysis dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - historical-online-chunked
    paths:
      - ".analysis-dashboard-trigger"
      - "scripts/build_prediction_windows.py"
      - "scripts/score_baseline_models.py"
      - "scripts/build_dashboard.py"
      - "scripts/build_model_comparison.py"
      - "data/reference/legality-calendar.json"
      - "data/processed/format-tags/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "analysis-dashboard"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: historical-online-chunked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build baseline prediction windows
        run: python scripts/build_prediction_windows.py

      - name: Score baseline models
        run: python scripts/score_baseline_models.py

      - name: Build interactive explorer
        run: python scripts/build_dashboard.py

      - name: Build model comparison page
        run: |
          python scripts/build_model_comparison.py
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/models.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("$('#class'].onchange", "$('#class').onchange")
          s = s.replace("$('#type'].onchange", "$('#type').onchange")
          s = s.replace("$('#search'].onchange", "$('#search').onchange")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit generated analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/prediction-windows results/prediction-windows data/processed/model-results results/model-results dashboard/index.html dashboard/models.html
          if ! git diff --cached --quiet; then
            git commit -m "analysis: score baseline models"
            git push origin HEAD:historical-online-chunked
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload explorer
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy explorer
        id: deployment
        uses: actions/deploy-pages@v4
