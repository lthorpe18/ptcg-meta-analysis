name: Run IRL-to-IRL regression analysis

on:
  push:
    branches:
      - research/irl-to-irl-regression
    paths:
      - "scripts/analyse_irl_to_irl_regression.py"
      - ".github/workflows/run-irl-to-irl-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "irl-to-irl-regression-research"
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoped research branch
        uses: actions/checkout@v4
        with:
          ref: research/irl-to-irl-regression

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run IRL-to-IRL regression analysis
        run: python scripts/analyse_irl_to_irl_regression.py

      - name: Commit generated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/irl-regression results/irl-regression
          if ! git diff --cached --quiet; then
            git commit -m "analysis: record IRL-to-IRL regression results"
            git push origin HEAD:research/irl-to-irl-regression
          fi
